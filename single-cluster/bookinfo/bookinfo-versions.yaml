##################################################################################################
# Version-specific services for Gateway API HTTPRoute support
# These services allow HTTPRoute to route to specific versions using backendRefs
#
# Required for Ambient mode with Gateway API routing
##################################################################################################

---
apiVersion: v1
kind: Service
metadata:
  name: reviews-v1
  namespace: bookinfo
  labels:
    app: reviews
    version: v1
spec:
  ports:
    - port: 9080
      name: http
  selector:
    app: reviews
    version: v1
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-v2
  namespace: bookinfo
  labels:
