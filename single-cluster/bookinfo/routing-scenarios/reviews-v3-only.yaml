# Route all traffic to reviews v3 (red stars)
# Based on: https://github.com/openshift-service-mesh/istio/tree/master/samples/bookinfo/gateway-api

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: bookinfo
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: reviews
      port: 9080
  rules:
    - backendRefs:
        - name: reviews-v3
          port: 9080
